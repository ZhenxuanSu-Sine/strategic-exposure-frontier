name: Generate baseline artifacts

on:
  push:
    paths:
      - '.github/workflows/generate-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install baseline dependencies
        run: python -m pip install --upgrade pip matplotlib pytest

      - name: Generate deterministic baseline results
        run: python scripts_run_all.py

      - name: Run self-test
        run: python selftest.py

      - name: Run pytest suite
        run: python -m pytest -q

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Generate baseline research artifacts"
            git push
          fi
